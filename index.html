<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NomaByte Studio — Mobile App Development</title>
  
  <!-- Favicon / Иконка логотипа -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotateX(8deg) rotateY(-5deg); }
      50% { transform: translateY(-12px) rotateX(12deg) rotateY(-2deg); }
    }
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    .animate-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#08090c] text-slate-100 font-sans selection:bg-cyan-500/30 selection:text-cyan-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const [loading, setLoading] = useState(false);
      const [showPrivacy, setShowPrivacy] = useState(false);
      const [showBetaModal, setShowBetaModal] = useState(false);
      const [betaSubmitted, setBetaSubmitted] = useState(false);
      const [betaLoading, setBetaLoading] = useState(false);

      const [formData, setFormData] = useState({ name: '', email: '', message: '' });
      const [betaData, setBetaData] = useState({ name: '', email: '', device: '', experience: '', rulesAgreed: false });

      // Отправка обычного сообщения
      const handleFormSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        const formSpreeUrl = "https://formspree.io/f/mwlvypbn"; 

        try {
          const response = await fetch(formSpreeUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(formData)
          });

          if (response.ok) {
            setSubmitted(true);
            setFormData({ name: '', email: '', message: '' });
            setTimeout(() => setSubmitted(false), 5000);
          } else {
            alert("Ошибка при отправке. Напишите нам в Telegram.");
          }
        } catch (error) {
          alert("Ошибка соединения.");
        } finally {
          setLoading(false);
        }
      };

      // Отправка заявки бета-тестера
      const handleBetaSubmit = async (e) => {
        e.preventDefault();
        if (!betaData.rulesAgreed) {
          alert("Пожалуйста, подтвердите согласие с правилами бета-тестирования.");
          return;
        }

        setBetaLoading(true);
        const formSpreeUrl = "https://formspree.io/f/mwlvypbn"; 

        try {
          const response = await fetch(formSpreeUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              subject: "🚀 Новая заявка в бета-тестеры!",
              name: betaData.name,
              email: betaData.email,
              device: betaData.device,
              experience: betaData.experience,
              rulesAgreed: "Согласен с правилами (Бесплатный тест)"
            })
          });

          if (response.ok) {
            setBetaSubmitted(true);
            setTimeout(() => {
              setBetaSubmitted(false);
              setShowBetaModal(false);
              setBetaData({ name: '', email: '', device: '', experience: '', rulesAgreed: false });
            }, 4000);
          } else {
            alert("Ошибка при отправке заявки.");
          }
        } catch (error) {
          alert("Ошибка соединения.");
        } finally {
          setBetaLoading(false);
        }
      };

      return (
        <div class="min-h-screen relative overflow-hidden bg-[#08090c]">
          {/* Background Grid & Glows */}
          <div class="fixed inset-0 pointer-events-none z-0">
            <div class="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px] opacity-25"></div>
            <div class="absolute top-[-10%] left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-cyan-500/10 blur-[140px] rounded-full animate-glow"></div>
            <div class="absolute bottom-[-10%] right-[-5%] w-[600px] h-[400px] bg-blue-600/10 blur-[150px] rounded-full"></div>
          </div>

          {/* Navigation Bar */}
          <header class="relative z-50 border-b border-slate-800/80 bg-[#08090c]/80 backdrop-blur-md sticky top-0">
            <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
              <div class="flex items-center gap-2 font-mono text-sm tracking-wider">
                <span class="text-cyan-400 font-bold">&gt;</span>
                <span class="text-slate-100 font-semibold">nomabyte@studio:~$</span>
                <span class="w-2 h-4 bg-cyan-400 animate-pulse inline-block"></span>
              </div>
              
              <nav class="hidden md:flex items-center gap-8 text-xs font-mono text-slate-400">
                <a href="#about" class="hover:text-cyan-400 transition-colors">#about</a>
                <a href="#apps" class="hover:text-cyan-400 transition-colors">#apps</a>
                <button onClick={() => setShowBetaModal(true)} class="text-cyan-400 hover:underline font-bold">#стать_бета_тестером</button>
                <a href="#contact" class="hover:text-cyan-400 transition-colors">#contact</a>
                <button onClick={() => setShowPrivacy(true)} class="hover:text-cyan-400 transition-colors">#privacy</button>
              </nav>

              <button 
                onClick={() => setShowBetaModal(true)}
                class="px-4 py-1.5 rounded-lg border border-cyan-500/40 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 font-mono text-xs transition-all shadow-[0_0_15px_rgba(6,182,212,0.15)]"
              >
                beta_tester
              </button>
            </div>
          </header>

          {/* Main Content */}
          <main class="relative z-10 max-w-6xl mx-auto px-6 pt-20 pb-24">
            
            {/* Hero Section */}
            <section id="about" class="text-center py-12 md:py-20 flex flex-col items-center">
              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-cyan-500/30 bg-cyan-950/40 text-cyan-400 text-xs font-mono mb-8 backdrop-blur-sm">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                AVAILABLE FOR NEW PROJECTS
              </div>

              <h1 class="text-5xl md:text-8xl font-black tracking-tight mb-6 bg-gradient-to-b from-white via-slate-100 to-slate-500 bg-clip-text text-transparent">
                NomaByte <span class="text-cyan-400">Studio</span>
              </h1>

              <div class="font-mono text-sm md:text-lg text-slate-400 mb-8 max-w-2xl flex items-center justify-center gap-2 flex-wrap">
                <span class="text-cyan-400 font-bold">$</span>
                <span>Mobile Apps</span>
                <span class="text-slate-600">|</span>
                <span>Cross-Platform Flutter</span>
                <span class="text-slate-600">|</span>
                <span>Android & iOS</span>
              </div>

              <p class="text-slate-400 max-w-2xl text-sm md:text-base leading-relaxed mb-10">
                Мы — независимая студия разработки мобильных приложений. Создаем продуманный софт, сочетающий высокую производительность, современный стек и реальную пользу для людей.
              </p>

              <div class="flex items-center gap-4 flex-wrap justify-center">
                <button 
                  onClick={() => setShowBetaModal(true)}
                  class="px-6 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-cyan-500/25 flex items-center gap-2"
                >
                  🚀 Стать бета-тестером
                </button>
                <a href="#apps" class="px-6 py-3 rounded-xl border border-slate-800 hover:border-slate-700 bg-slate-900/60 text-slate-300 font-semibold text-sm transition-all">
                  Смотреть приложения
                </a>
              </div>
            </section>

            {/* App Showcase */}
            <section id="apps" class="py-20 border-t border-slate-800/60">
              <div class="text-center mb-16">
                <h2 class="font-mono text-xs text-cyan-400 tracking-widest uppercase mb-2">// SHOWCASE</h2>
                <h3 class="text-3xl md:text-5xl font-extrabold text-white">Наши разработки</h3>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                
                {/* 3D Phone Mockup */}
                <div class="lg:col-span-6 flex justify-center py-6">
                  <div class="relative w-[280px] h-[570px] bg-slate-950 rounded-[45px] p-3 border-4 border-slate-700/80 shadow-[0_25px_60px_-15px_rgba(6,182,212,0.25)] animate-float perspective-1000">
                    <div class="absolute top-5 left-1/2 -translate-x-1/2 w-20 h-4 bg-slate-900 rounded-full z-30 flex items-center justify-center gap-2 border border-slate-800">
                      <div class="w-2.5 h-2.5 bg-black rounded-full border border-slate-700"></div>
                      <div class="w-1.5 h-1.5 bg-blue-950 rounded-full"></div>
                    </div>

                    <div class="w-full h-full bg-slate-900 rounded-[35px] overflow-hidden relative border border-slate-800 flex flex-col pt-8">
                      <div class="bg-blue-600 p-4 text-white">
                        <div class="flex items-center justify-between mb-1">
                          <span class="text-[10px] font-mono tracking-wider opacity-80">VODIČÁK SK</span>
                          <span class="text-[10px] font-mono bg-blue-700 px-2 py-0.5 rounded">v1.2</span>
                        </div>
                        <h4 class="font-bold text-sm">Тест ПДД Словакии</h4>
                      </div>

                      <div class="p-4 flex-1 flex flex-col justify-between bg-slate-950 text-xs">
                        <div>
                          <div class="text-[10px] font-mono text-cyan-400 mb-2">Вопрос 1 / 20:</div>
                          <p class="font-medium text-slate-200 mb-4 leading-relaxed">
                            Aké je maximálne povolené rýchlostné obmedzenie v obci?
                          </p>
                          <div class="space-y-2">
                            {[
                              { id: 'a', text: '50 km/h', correct: true },
                              { id: 'b', text: '60 km/h', correct: false },
                              { id: 'c', text: '90 km/h', correct: false }
                            ].map((opt) => (
                              <button
                                key={opt.id}
                                onClick={() => setSelectedAnswer(opt.id)}
                                class={`w-full text-left p-2.5 rounded-lg border transition-all ${
                                  selectedAnswer === opt.id
                                    ? opt.correct ? 'bg-emerald-950/60 border-emerald-500 text-emerald-300' : 'bg-rose-950/60 border-rose-500 text-rose-300'
                                    : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                                }`}
                              >
                                <span class="font-mono text-[10px] mr-2 text-slate-500">{opt.id.toUpperCase()})</span>
                                {opt.text}
                              </button>
                            ))}
                          </div>
                        </div>
                        {selectedAnswer && (
                          <div class="p-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] text-center font-mono">
                            ✓ Správne! (50 km/h v obci)
                          </div>
                        )}
                      </div>
                      <div class="h-4 bg-slate-950 flex justify-center items-center pb-1">
                        <div class="w-24 h-1 bg-slate-700 rounded-full"></div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Descriptions & Beta CTA */}
                <div class="lg:col-span-6 space-y-8">
                  <div class="p-6 rounded-2xl bg-slate-900/50 border border-slate-800 hover:border-slate-700 transition-all">
                    <div class="flex items-center gap-3 mb-4">
                      <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold font-mono">SK</div>
                      <div>
                        <h4 class="text-xl font-bold text-white">Vodičák SK</h4>
                        <span class="text-xs font-mono text-emerald-400 flex items-center gap-1">
                          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Опубликовано в Google Play
                        </span>
                      </div>
                    </div>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6">
                      Приложение для подготовки к теоретическому экзамену по вождению в Словакии. Интерактивные тесты и статистика.
                    </p>
                    <button onClick={() => setShowPrivacy(true)} class="text-xs font-mono text-cyan-400 hover:underline flex items-center gap-1">
                      📄 Zásady ochrany osobných údajov &rarr;
                    </button>
                  </div>

                  <div class="p-6 rounded-2xl bg-cyan-950/20 border border-cyan-500/30 flex flex-col md:flex-row items-center justify-between gap-4">
                    <div>
                      <h4 class="text-lg font-bold text-white mb-1">Хотите тестировать новые фичи первыми?</h4>
                      <p class="text-xs text-slate-400">Присоединяйтесь к закрытой программе бета-тестирования NomaByte.</p>
                    </div>
                    <button 
                      onClick={() => setShowBetaModal(true)}
                      class="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs font-mono whitespace-nowrap transition-all shadow-md"
                    >
                      Подать заявку
                    </button>
                  </div>
                </div>

              </div>
            </section>

            {/* Contact Section */}
            <section id="contact" class="py-20 border-t border-slate-800/60">
              <div class="max-w-3xl mx-auto">
                <div class="text-center mb-12">
                  <h2 class="font-mono text-xs text-cyan-400 tracking-widest uppercase mb-2">// GET IN TOUCH</h2>
                  <h3 class="text-3xl md:text-5xl font-extrabold text-white mb-4">Написать нам</h3>
                </div>

                <form onSubmit={handleFormSubmit} class="p-8 rounded-3xl bg-slate-900/40 border border-slate-800 space-y-5">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                      <label class="block font-mono text-xs text-slate-400 mb-2">ВАШЕ ИМЯ</label>
                      <input
                        type="text"
                        name="name"
                        required
                        placeholder="Саша"
                        value={formData.name}
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 text-sm"
                      />
                    </div>
                    <div>
                      <label class="block font-mono text-xs text-slate-400 mb-2">EMAIL</label>
                      <input
                        type="email"
                        name="email"
                        required
                        placeholder="name@domain.com"
                        value={formData.email}
                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                        class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 text-sm"
                      />
                    </div>
                  </div>
                  <div>
                    <label class="block font-mono text-xs text-slate-400 mb-2">СООБЩЕНИЕ</label>
                    <textarea
                      rows="4"
                      name="message"
                      required
                      placeholder="Ваше сообщение..."
                      value={formData.message}
                      onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                      class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 text-sm resize-none"
                    ></textarea>
                  </div>
                  <button
                    type="submit"
                    disabled={loading}
                    class="w-full py-4 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition-all font-mono disabled:opacity-50"
                  >
                    {loading ? 'SENDING...' : 'SEND_MESSAGE →'}
                  </button>
                  {submitted && (
                    <div class="p-4 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-300 text-xs font-mono text-center">
                      ✓ Сообщение успешно отправлено на почту разработчикам!
                    </div>
                  )}
                </form>
              </div>
            </section>

          </main>

          {/* Модальное окно: Стать бета-тестером */}
          {showBetaModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div class="bg-slate-900 border border-slate-800 max-w-xl w-full rounded-3xl p-6 md:p-8 relative shadow-2xl my-8">
                <button
                  onClick={() => setShowBetaModal(false)}
                  class="absolute top-6 right-6 w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center font-mono font-bold"
                >
                  ✕
                </button>

                <h2 class="text-2xl font-bold text-white mb-2">🚀 Заявка на бета-тестирование</h2>
                <p class="text-xs text-slate-400 mb-6 font-mono">Заполните анкету, чтобы получить ранний доступ к нашим новым приложениям.</p>

                <form onSubmit={handleBetaSubmit} class="space-y-4">
                  <div>
                    <label class="block font-mono text-xs text-slate-400 mb-1">ВАШЕ ИМЯ</label>
                    <input
                      type="text"
                      required
                      placeholder="Александр"
                      value={betaData.name}
                      onChange={(e) => setBetaData({ ...betaData, name: e.target.value })}
                      class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-500"
                    />
                  </div>

                  <div>
                    <label class="block font-mono text-xs text-slate-400 mb-1">EMAIL (Google Play / Apple ID)</label>
                    <input
                      type="email"
                      required
                      placeholder="name@gmail.com"
                      value={betaData.email}
                      onChange={(e) => setBetaData({ ...betaData, email: e.target.value })}
                      class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-500"
                    />
                  </div>

                  <div>
                    <label class="block font-mono text-xs text-slate-400 mb-1">ВАШ УСТРОЙСТВО</label>
                    <input
                      type="text"
                      required
                      placeholder="например, Samsung Galaxy S23 / iPhone 14"
                      value={betaData.device}
                      onChange={(e) => setBetaData({ ...betaData, device: e.target.value })}
                      class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-500"
                    />
                  </div>

                  <div>
                    <label class="block font-mono text-xs text-slate-400 mb-1">ПОЧЕМУ ИНТЕРЕСЕН ТЕСТ?</label>
                    <textarea
                      rows="2"
                      placeholder="Кратко о себе или вашем опыте..."
                      value={betaData.experience}
                      onChange={(e) => setBetaData({ ...betaData, experience: e.target.value })}
                      class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-500 resize-none"
                    ></textarea>
                  </div>

                  {/* Правила бета-теста */}
                  <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-400 space-y-2">
                    <div class="font-bold text-slate-200 uppercase font-mono text-[11px]">// Правила бета-тестирования:</div>
                    <ul class="list-disc pl-4 space-y-1">
                      <li>Участие в программе бета-тестирования является добровольным и <strong>не оплачивается</strong> разработчиком.</li>
                      <li>Тестировщик получает ранний доступ к программному обеспечению «как есть» (as is).</li>
                      <li>Все найденные баги и отзывы обязуетесь отправлять разработчикам.</li>
                    </ul>
                  </div>

                  {/* Чекбокс согласия */}
                  <div class="flex items-start gap-3 pt-2">
                    <input
                      type="checkbox"
                      id="rules"
                      required
                      checked={betaData.rulesAgreed}
                      onChange={(e) => setBetaData({ ...betaData, rulesAgreed: e.target.checked })}
                      class="mt-0.5 w-4 h-4 rounded bg-slate-950 border-slate-800 text-cyan-500 focus:ring-0 cursor-pointer"
                    />
                    <label for="rules" class="text-xs text-slate-300 cursor-pointer select-none">
                      Я прочитал и полностью согласен с правилами бета-тестирования (понимаю, что тест бесплатный и без денежного вознаграждения).
                    </label>
                  </div>

                  <button
                    type="submit"
                    disabled={betaLoading}
                    class="w-full py-3.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition-all font-mono shadow-lg disabled:opacity-50"
                  >
                    {betaLoading ? 'ОТПРАВКА...' : 'ОТПРАВИТЬ ЗАЯВКУ →'}
                  </button>

                  {betaSubmitted && (
                    <div class="p-3 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-300 text-xs font-mono text-center">
                      ✓ Анкета успешно отправлена разработчикам! Ждите приглашение.
                    </div>
                  )}
                </form>
              </div>
            </div>
          )}

          {/* Privacy Policy Modal */}
          {showPrivacy && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-800 max-w-3xl w-full max-h-[85vh] rounded-3xl p-6 md:p-8 overflow-y-auto relative shadow-2xl">
                <button
                  onClick={() => setShowPrivacy(false)}
                  class="absolute top-6 right-6 w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center font-mono font-bold"
                >
                  ✕
                </button>
                <h2 class="text-2xl font-bold text-white mb-2">Zásady ochrany osobných údajov</h2>
                <div class="text-xs font-mono text-cyan-400 mb-6">Aplikácia: Vodičák SK | Vývojár: NomaByte</div>
                <div class="text-slate-300 text-sm space-y-4 leading-relaxed">
