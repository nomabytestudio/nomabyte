    .n { transform-box: fill-box; transform-origin: center; transform: scale(0); }
    .ring { fill: none; stroke: #52dcff; stroke-width: 2.5; opacity: 0; transform-box: fill-box; transform-origin: center; }
    .core { fill: #b8f3ff; opacity: 0; filter: blur(8px); }
    .pulse { fill: #d6f8ff; filter: drop-shadow(0 0 7px #2fd0ff) drop-shadow(0 0 3px #fff); }
    .w, .s { opacity: 0; }
    .w { font-weight: 700; font-size: 92px; }
    .s { font-weight: 600; font-size: 34px; }
    
    .go .l { animation: draw 1s cubic-bezier(.6,0,.2,1) forwards; animation-delay: calc(.4s + var(--i)*.12s); }
    .go .halo { animation: halo 3s ease-in-out forwards; animation-delay: calc(var(--i)*.14s); }
    .go .n { animation: pop .6s cubic-bezier(.3,1.6,.5,1) forwards; animation-delay: calc(var(--i)*.14s); }
    .go .ring { animation: ring 1.2s ease-out forwards; animation-delay: calc(var(--i)*.14s + .1s); }
    .go .core { animation: core 1.5s ease-out 1.5s forwards; }
    .go .cring { animation: ring 2s ease-out 1.6s forwards; }
    .go .w { animation: fade 0.8s ease-out 1.8s forwards; }
    .go .s { animation: fade 0.8s ease-out 2.2s forwards; }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { to { transform: scale(1); } }
    @keyframes halo { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.6); opacity: .8; } 100% { transform: scale(1.2); opacity: .5; } }

    @keyframes fade { to { opacity: 1; } }

  <script>
    setTimeout(() => {
      const intro = document.getElementById('introScreen');
      if (intro) intro.classList.add('fade-out');
    }, 3200);

    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    let isRainActive = true;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const drops = [];
    for (let i = 0; i < 110; i++) {
      drops.push({
        x: Math.random() * width,
        y: Math.random() * height,
        length: Math.random() * 20 + 10,
        speed: Math.random() * 8 + 4,
        opacity: Math.random() * 0.35 + 0.15
      });
    }

    function drawRain() {
      ctx.clearRect(0, 0, width, height);
      if (isRainActive) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.2;
        for (let i = 0; i < drops.length; i++) {
          const d = drops[i];
          ctx.beginPath();
          ctx.globalAlpha = d.opacity;
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x - d.length * 0.1, d.y + d.length);
          ctx.stroke();

          d.y += d.speed;
          d.x -= d.speed * 0.1;

          if (d.y > height) {
            d.y = -20;
            d.x = Math.random() * width;
          }
        }
      }
      requestAnimationFrame(drawRain);
    }
    drawRain();

    window.toggleRainAnimation = function(state) {
      isRainActive = state;
    };
  </script>

                {t.heroTag}
              </div>

              <h1 class="text-5xl md:text-8xl font-black tracking-tight mb-6 bg-gradient-to-b from-white via-slate-100 to-slate-500 bg-clip-text text-transparent">
                NomaByte <span class="text-cyan-400">Studio</span>
              </h1>

              <p class="font-mono-code text-xs md:text-sm text-slate-400 mb-6 max-w-2xl">
                {t.heroSub}
              </p>

              <p class="text-slate-400 max-w-2xl text-sm md:text-base leading-relaxed mb-10">
                {t.heroDesc}
              </p>

              <div class="flex items-center gap-4 flex-wrap justify-center">
                <button 
                  onClick={() => setShowBetaModal(true)}
                  class="px-7 py-3.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-cyan-500/25 flex items-center gap-2"
                >
                  {t.btnBeta}
                </button>
                <button 
                  onClick={() => window.location.href = 'dashboard.html'}
                  class="px-7 py-3.5 rounded-xl border border-amber-500/40 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 font-bold text-sm transition-all flex items-center gap-2"
                >
                  🔐 Tester Dashboard
                </button>
              </div>
            </section>

            {/* Демонстрация Приложений */}
            <section id="apps" class="py-20 border-t border-slate-800/60">
              <div class="text-center mb-16">
                <h2 class="font-mono-code text-xs text-cyan-400 tracking-widest uppercase mb-2">// {t.showcaseSub}</h2>
                <h3 class="text-3xl md:text-5xl font-extrabold text-white">{t.showcaseTitle}</h3>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                
                {/* 3D Телефон */}
                <div class="lg:col-span-6 flex justify-center py-4">
                  <div class="relative w-[285px] h-[575px] bg-slate-950 rounded-[45px] p-3 border-4 border-slate-700/80 shadow-[0_25px_60px_-15px_rgba(6,182,212,0.25)] animate-phone">
                    <div class="absolute top-5 left-1/2 -translate-x-1/2 w-20 h-4 bg-slate-900 rounded-full z-30 flex items-center justify-center gap-2 border border-slate-800">
                      <div class="w-2.5 h-2.5 bg-black rounded-full border border-slate-700"></div>
                      <div class="w-1.5 h-1.5 bg-blue-950 rounded-full"></div>
                    </div>

                    <div class="w-full h-full bg-slate-900 rounded-[35px] overflow-hidden relative border border-slate-800 flex flex-col pt-8">
                      <div class="bg-blue-600 p-4 text-white">
                        <div class="flex items-center justify-between mb-1">
                          <span class="text-[10px] font-mono-code tracking-wider opacity-80">VODIČÁK SK</span>
                          <span class="text-[10px] font-mono-code bg-blue-700 px-2 py-0.5 rounded">v1.2</span>
                        </div>
                        <h4 class="font-bold text-sm">Vodičský test SR 2026</h4>
                      </div>

                      <div class="p-4 flex-1 flex flex-col justify-between bg-slate-950 text-xs">
                        <div>
                          <div class="text-[10px] font-mono-code text-cyan-400 mb-2">Otázka 1 / 20:</div>
                          <p class="font-medium text-slate-200 mb-4 leading-relaxed">
                            Aké je maximálne povolené rýchlostné obmedzenie v obci?
                          </p>

                          <div class="space-y-2">
                            {[
                              { id: 'a', text: '50 km/h', correct: true },
                              { id: 'b', text: '60 km/h', correct: false },
                              { id: 'c', text: '90 km/h', correct: false }
                            ].map((opt) => (
                              <button
                                key={opt.id}
                                onClick={() => setSelectedAnswer(opt.id)}
                                class={`w-full text-left p-2.5 rounded-lg border transition-all ${
                                  selectedAnswer === opt.id
                                    ? opt.correct ? 'bg-emerald-950/60 border-emerald-500 text-emerald-300' : 'bg-rose-950/60 border-rose-500 text-rose-300'
                                    : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                                }`}
                              >
                                <span class="font-mono-code text-[10px] mr-2 text-slate-500">{opt.id.toUpperCase()})</span>
                                {opt.text}
                              </button>
                            ))}
                          </div>
                        </div>

                        {selectedAnswer && (
                          <div class="p-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] text-center font-mono-code">
                            ✓ Správne! (50 km/h)
                          </div>
                        )}
                        <div class="text-center pt-2">
                          <span class="text-[9px] font-mono-code text-slate-600 uppercase">Live Interactive Demo</span>
                        </div>
                      </div>

                      <div class="h-4 bg-slate-950 flex justify-center items-center pb-1">
                        <div class="w-24 h-1 bg-slate-700 rounded-full"></div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Карточки проектов */}
                <div class="lg:col-span-6 space-y-6">
                  <div class="p-6 rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-slate-700 transition-all backdrop-blur-sm">
                    <div class="flex items-center gap-3 mb-4">
                      <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold font-mono-code">SK</div>
                      <div>
                        <h4 class="text-xl font-bold text-white">{t.pdTitle}</h4>
                        <span class="text-xs font-mono-code text-emerald-400 flex items-center gap-1">
                          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> {t.pdBadge}
                        </span>
                      </div>
                    </div>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6">{t.pdDesc}</p>
                    <div class="flex items-center gap-3">
                      <span class="px-3 py-1 rounded-md bg-slate-800 text-slate-300 font-mono-code text-xs">Flutter</span>
                      <span class="px-3 py-1 rounded-md bg-slate-800 text-slate-300 font-mono-code text-xs">Dart</span>
                      <span class="px-3 py-1 rounded-md bg-slate-800 text-slate-300 font-mono-code text-xs">Firebase</span>
                    </div>
                  </div>

                  <div class="p-6 rounded-2xl bg-cyan-950/20 border border-dashed border-cyan-500/30 backdrop-blur-sm">
                    <div class="flex items-center gap-3 mb-4">
                      <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 font-mono-code font-bold">?</div>
                      <div>
                        <h4 class="text-xl font-bold text-white">{t.secretTitle}</h4>
                        <span class="text-xs font-mono-code text-cyan-400 flex items-center gap-1">
                          <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span> {t.secretBadge}
                        </span>
                      </div>
                    </div>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6">{t.secretDesc}</p>
                    <button 
                      onClick={() => setShowBetaModal(true)}
                      class="px-4 py-2 rounded-xl bg-cyan-500/20 border border-cyan-500/40 hover:bg-cyan-500/30 text-cyan-300 font-mono-code text-xs font-bold transition-all"
                    >
                      Apply for Beta Access →
                    </button>
                  </div>
                </div>

              </div>
            </section>

            {/* Контакты и Форма Техподдержки */}
            <section id="contact" class="py-20 border-t border-slate-800/60">
              <div class="max-w-3xl mx-auto">
                <div class="text-center mb-12">
                  <h2 class="font-mono-code text-xs text-cyan-400 tracking-widest uppercase mb-2">// {t.contactSub}</h2>
                  <h3 class="text-3xl md:text-5xl font-extrabold text-white mb-3">{t.contactTitle}</h3>
                  <p class="text-slate-400 text-sm">{t.supportDesc}</p>
                </div>

                <div class="mb-8">
                  <a
                    href="https://t.me/nomabytestudio"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-cyan-500/50 transition-all flex items-center justify-between group"
                  >
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 font-bold font-mono-code">TG</div>
                      <div>
                        <div class="font-bold text-white text-sm">Telegram Direct Support</div>
                        <div class="text-xs font-mono-code text-slate-400">@nomabytestudio</div>
                      </div>
                    </div>
                    <span class="text-cyan-400 font-mono-code text-lg group-hover:translate-x-1 transition-transform">&rarr;</span>
                  </a>
                </div>

                <form onSubmit={handleContactSubmit} class="p-8 rounded-3xl bg-slate-900/40 border border-slate-800 space-y-5 backdrop-blur-sm">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                      <label class="block font-mono-code text-xs text-slate-400 mb-2">{t.formName}</label>
                      <input
                        type="text"
                        required
                        placeholder="Alexandr"
                        value={contactForm.name}
                        onChange={(e) => setContactForm({ ...contactForm, name: e.target.value })}
                        class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 text-sm"
                      />
                    </div>
                    <div>
                      <label class="block font-mono-code text-xs text-slate-400 mb-2">{t.formEmail}</label>
                      <input
                        type="email"
                        required
                        placeholder="name@domain.com"
                        value={contactForm.email}
                        onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                        class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 text-sm"
                      />
                    </div>
                  </div>

                  <div>
                    <label class="block font-mono-code text-xs text-slate-400 mb-2">{t.formMsg}</label>
                    <textarea
                      rows="4"
                      required
                      placeholder="Type your message or bug report here..."
                      value={contactForm.message}
                      onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}
                      class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 text-sm resize-none"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    disabled={loadingContact}
                    class="w-full py-4 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition-all font-mono-code disabled:opacity-50 shadow-lg shadow-cyan-500/20"
                  >
                    {loadingContact ? t.btnSending : t.btnSend}
                  </button>

                  {contactSubmitted && (
                    <div class="p-4 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-300 text-xs font-mono-code text-center">
                      {t.msgSuccess}
                    </div>
                  )}
                </form>
              </div>
            </section>

          </main>

          {/* Модальное окно: Заявка в Бета-тестеры */}
          {showBetaModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div class="bg-slate-900 border border-slate-800 max-w-xl w-full rounded-3xl p-6 md:p-8 relative shadow-2xl my-8">
                <button
                  onClick={() => setShowBetaModal(false)}
                  class="absolute top-6 right-6 w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center font-mono-code font-bold"
                >
                  ✕
                </button>

                <h2 class="text-2xl font-bold text-white mb-1">{t.betaModalTitle}</h2>
                <p class="text-xs text-slate-400 mb-6 font-mono-code">{t.betaModalSub}</p>

                <form onSubmit={handleBetaSubmit} class="space-y-4">
                  <div>
                    <label class="block font-mono-code text-xs text-slate-400 mb-1">{t.formName}</label>
                    <input
                      type="text"
                      required
                      placeholder="Alexandr"
                      value={betaForm.name}
                      onChange={(e) => setBetaForm({ ...betaForm, name: e.target.value })}
                      class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-500"
                    />
                  </div>

                  <div>
                    <label class="block font-mono-code text-xs text-slate-400 mb-1">{t.formEmail} (Google Play / Apple ID)</label>
                    <input
                      type="email"
                      required
                      placeholder="name@gmail.com"
                      value={betaForm.email}
                      onChange={(e) => setBetaForm({ ...betaForm, email: e.target.value })}
                      class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-500"
                    />
                  </div>

                  <div>
                    <label class="block font-mono-code text-xs text-slate-400 mb-1">{t.betaDevice}</label>
                    <input
                      type="text"
                      required
                      placeholder="iPhone 15 Pro / Samsung Galaxy S24"
                      value={betaForm.device}
                      onChange={(e) => setBetaForm({ ...betaForm, device: e.target.value })}
                      class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-500"
                    />
                  </div>

                  <div>
                    <label class="block font-mono-code text-xs text-slate-400 mb-1">{t.betaExp}</label>
                    <textarea
                      rows="2"
                      placeholder="Short note about why you want to test..."
                      value={betaForm.experience}
                      onChange={(e) => setBetaForm({ ...betaForm, experience: e.target.value })}
                      class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-500 resize-none"
                    ></textarea>
                  </div>

                  <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-400 space-y-1.5">
                    <div class="font-bold text-slate-200 font-mono-code text-[11px]">{t.betaRulesTitle}</div>
                    <ul class="list-disc pl-4 space-y-1 text-[11px]">
                      <li>{t.betaRule1}</li>
                      <li>{t.betaRule2}</li>
                      <li>{t.betaRule3}</li>
                    </ul>
                  </div>

                  <div class="flex items-start gap-3 pt-1">
                    <input
                      type="checkbox"
                      id="betaTerms"
                      required
                      checked={betaForm.agreed}
                      onChange={(e) => setBetaForm({ ...betaForm, agreed: e.target.checked })}
                      class="mt-0.5 w-4 h-4 rounded bg-slate-950 border-slate-800 text-cyan-500 focus:ring-0 cursor-pointer"
                    />
                    <label for="betaTerms" class="text-xs text-slate-300 cursor-pointer select-none leading-tight">
                      {t.betaCheckbox}
                    </label>
                  </div>

                  <button
                    type="submit"
                    disabled={loadingBeta}
                    class="w-full py-3.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition-all font-mono-code shadow-lg disabled:opacity-50"
                  >
                    {loadingBeta ? 'SUBMITTING...' : t.btnSubmitBeta}
                  </button>

                  {betaSubmitted && (
                    <div class="p-3 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-300 text-xs font-mono-code text-center">
                      {t.betaSuccess}
                    </div>
                  )}
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer class="border-t border-slate-800/80 py-8 bg-[#030406]">
            <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 font-mono-code text-xs text-slate-500">
              <div>© 2026 NomaByte Studio. All rights reserved.</div>
              <div class="flex items-center gap-6">
                <a href="Privacypolicy.html" class="hover:text-cyan-400 transition-colors">Privacy Policy</a>
                <span>•</span>
                <a href="https://t.me/nomabytestudio" target="_blank" class="hover:text-cyan-400 transition-colors">Telegram</a>
                <span>•</span>
                <span>Bratislava, SK</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
