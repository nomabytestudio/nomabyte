<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NomaByte Studio — Mobile App Development</title>
  
  <!-- Favicon / Иконка логотипа для браузеров и поиска Google -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotateX(8deg) rotateY(-5deg); }
      50% { transform: translateY(-12px) rotateX(12deg) rotateY(-2deg); }
    }
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    .animate-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#08090c] text-slate-100 font-sans selection:bg-cyan-500/30 selection:text-cyan-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const [showPrivacy, setShowPrivacy] = useState(false);
      const [formData, setFormData] = useState({ name: '', email: '', message: '' });

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (formData.name && formData.email) {
          setSubmitted(true);
          setTimeout(() => {
            setSubmitted(false);
            setFormData({ name: '', email: '', message: '' });
          }, 4000);
        }
      };

      return (
        <div class="min-h-screen relative overflow-hidden bg-[#08090c]">
          {/* Background Technical Grid & Ambient Glows */}
          <div class="fixed inset-0 pointer-events-none z-0">
            <div class="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px] opacity-25"></div>
            <div class="absolute top-[-10%] left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-cyan-500/10 blur-[140px] rounded-full animate-glow"></div>
            <div class="absolute bottom-[-10%] right-[-5%] w-[600px] h-[400px] bg-blue-600/10 blur-[150px] rounded-full"></div>
          </div>

          {/* Navigation Bar */}
          <header class="relative z-50 border-b border-slate-800/80 bg-[#08090c]/80 backdrop-blur-md sticky top-0">
            <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
              <div class="flex items-center gap-2 font-mono text-sm tracking-wider">
                <span class="text-cyan-400 font-bold">&gt;</span>
                <span class="text-slate-100 font-semibold">nomabyte@studio:~$</span>
                <span class="w-2 h-4 bg-cyan-400 animate-pulse inline-block"></span>
              </div>
              
              <nav class="hidden md:flex items-center gap-8 text-xs font-mono text-slate-400">
                <a href="#about" class="hover:text-cyan-400 transition-colors">#about</a>
                <a href="#apps" class="hover:text-cyan-400 transition-colors">#apps</a>
                <a href="#contact" class="hover:text-cyan-400 transition-colors">#contact</a>
                <button onClick={() => setShowPrivacy(true)} class="hover:text-cyan-400 transition-colors">#privacy_policy</button>
              </nav>

              <a href="#contact" class="px-4 py-1.5 rounded-lg border border-cyan-500/40 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 font-mono text-xs transition-all shadow-[0_0_15px_rgba(6,182,212,0.15)]">
                hire_us
              </a>
            </div>
          </header>

          {/* Main Content */}
          <main class="relative z-10 max-w-6xl mx-auto px-6 pt-20 pb-24">
            
            {/* Hero Section */}
            <section id="about" class="text-center py-12 md:py-20 flex flex-col items-center">
              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-cyan-500/30 bg-cyan-950/40 text-cyan-400 text-xs font-mono mb-8 backdrop-blur-sm">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                AVAILABLE FOR NEW PROJECTS
              </div>

              <h1 class="text-5xl md:text-8xl font-black tracking-tight mb-6 bg-gradient-to-b from-white via-slate-100 to-slate-500 bg-clip-text text-transparent">
                NomaByte <span class="text-cyan-400">Studio</span>
              </h1>

              <div class="font-mono text-sm md:text-lg text-slate-400 mb-8 max-w-2xl flex items-center justify-center gap-2 flex-wrap">
                <span class="text-cyan-400 font-bold">$</span>
                <span>Mobile Apps</span>
                <span class="text-slate-600">|</span>
                <span>Cross-Platform Flutter</span>
                <span class="text-slate-600">|</span>
                <span>Android & iOS</span>
              </div>

              <p class="text-slate-400 max-w-2xl text-sm md:text-base leading-relaxed mb-10">
                Мы — независимая студия разработки мобильных приложений. Создаем продуманный софт, сочетающий высокую производительность, современный стек и реальную пользу для людей.
              </p>

              <div class="flex items-center gap-4">
                <a href="#apps" class="px-6 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-cyan-500/25 flex items-center gap-2">
                  Смотреть приложения
                  <span class="font-mono">&rarr;</span>
                </a>
                <a href="#contact" class="px-6 py-3 rounded-xl border border-slate-800 hover:border-slate-700 bg-slate-900/60 text-slate-300 font-semibold text-sm transition-all">
                  Связаться
                </a>
              </div>

              <div class="mt-20 flex flex-col items-center gap-2 opacity-50 hover:opacity-100 transition-opacity">
                <span class="font-mono text-[10px] tracking-widest text-slate-500 uppercase">Scroll to explore</span>
                <div class="w-5 h-8 rounded-full border-2 border-slate-700 flex justify-center pt-1.5">
                  <div class="w-1 h-2 bg-cyan-400 rounded-full animate-bounce"></div>
                </div>
              </div>
            </section>

            {/* App Showcase with Animated Android Phone */}
            <section id="apps" class="py-20 border-t border-slate-800/60">
              <div class="text-center mb-16">
                <h2 class="font-mono text-xs text-cyan-400 tracking-widest uppercase mb-2">// SHOWCASE</h2>
                <h3 class="text-3xl md:text-5xl font-extrabold text-white">Наши разработки</h3>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                
                {/* 3D Animated Android Phone */}
                <div class="lg:col-span-6 flex justify-center py-6">
                  <div class="relative w-[280px] h-[570px] bg-slate-950 rounded-[45px] p-3 border-4 border-slate-700/80 shadow-[0_25px_60px_-15px_rgba(6,182,212,0.25)] animate-float perspective-1000">
                    {/* Camera Notch */}
                    <div class="absolute top-5 left-1/2 -translate-x-1/2 w-20 h-4 bg-slate-900 rounded-full z-30 flex items-center justify-center gap-2 border border-slate-800">
                      <div class="w-2.5 h-2.5 bg-black rounded-full border border-slate-700"></div>
                      <div class="w-1.5 h-1.5 bg-blue-950 rounded-full"></div>
                    </div>

                    {/* Phone Screen */}
                    <div class="w-full h-full bg-slate-900 rounded-[35px] overflow-hidden relative border border-slate-800 flex flex-col pt-8">
                      {/* App Header inside phone */}
                      <div class="bg-blue-600 p-4 text-white">
                        <div class="flex items-center justify-between mb-1">
                          <span class="text-[10px] font-mono tracking-wider opacity-80">VODIČÁK SK</span>
                          <span class="text-[10px] font-mono bg-blue-700 px-2 py-0.5 rounded">v1.2</span>
                        </div>
                        <h4 class="font-bold text-sm">Тест ПДД Словакии</h4>
                      </div>

                      {/* Interactive App Screen */}
                      <div class="p-4 flex-1 flex flex-col justify-between bg-slate-950 text-xs">
                        <div>
                          <div class="text-[10px] font-mono text-cyan-400 mb-2">Вопрос 1 / 20:</div>
                          <p class="font-medium text-slate-200 mb-4 leading-relaxed">
                            Aké je maximálne povolené rýchlostné obmedzenie v obci?
                          </p>

                          <div class="space-y-2">
                            {[
                              { id: 'a', text: '50 km/h', correct: true },
                              { id: 'b', text: '60 km/h', correct: false },
                              { id: 'c', text: '90 km/h', correct: false }
                            ].map((opt) => (
                              <button
                                key={opt.id}
                                onClick={() => setSelectedAnswer(opt.id)}
                                class={`w-full text-left p-2.5 rounded-lg border transition-all ${
                                  selectedAnswer === opt.id
                                    ? opt.correct
                                      ? 'bg-emerald-950/60 border-emerald-500 text-emerald-300'
                                      : 'bg-rose-950/60 border-rose-500 text-rose-300'
                                    : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                                }`}
                              >
                                <span class="font-mono text-[10px] mr-2 text-slate-500">{opt.id.toUpperCase()})</span>
                                {opt.text}
                              </button>
                            ))}
                          </div>
                        </div>

                        {selectedAnswer && (
                          <div class="p-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] text-center font-mono">
                            ✓ Správne! (50 km/h v obci)
                          </div>
                        )}

                        <div class="text-center pt-2">
                          <span class="text-[9px] font-mono text-slate-600 uppercase">Live Demo • Tap options above</span>
                        </div>
                      </div>

                      {/* Android Bottom Navigation Line */}
                      <div class="h-4 bg-slate-950 flex justify-center items-center pb-1">
                        <div class="w-24 h-1 bg-slate-700 rounded-full"></div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Projects Descriptions */}
                <div class="lg:col-span-6 space-y-8">
                  {/* Active Published App */}
                  <div class="p-6 rounded-2xl bg-slate-900/50 border border-slate-800 hover:border-slate-700 transition-all">
                    <div class="flex items-center gap-3 mb-4">
                      <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold font-mono">
                        SK
                      </div>
                      <div>
                        <h4 class="text-xl font-bold text-white">Vodičák SK</h4>
                        <span class="text-xs font-mono text-emerald-400 flex items-center gap-1">
                          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Опубликовано в Google Play
                        </span>
                      </div>
                    </div>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6">
                      Приложение для эффективной подготовки к теоретическому экзамену по вождению в Словакии. Интерактивные тесты, карточки вопросов, учет статистики ответов.
                    </p>
                    <div class="flex items-center gap-3 mb-4">
                      <span class="px-3 py-1 rounded-md bg-slate-800 text-slate-300 font-mono text-xs">Flutter</span>
                      <span class="px-3 py-1 rounded-md bg-slate-800 text-slate-300 font-mono text-xs">Dart</span>
                      <span class="px-3 py-1 rounded-md bg-slate-800 text-slate-300 font-mono text-xs">Firebase</span>
                    </div>

                    <button
                      onClick={() => setShowPrivacy(true)}
                      class="text-xs font-mono text-cyan-400 hover:underline flex items-center gap-1"
                    >
                      📄 Zásady ochrany osobných údajov (Privacy Policy) &rarr;
                    </button>
                  </div>

                  {/* Secret Project In-Development */}
                  <div class="p-6 rounded-2xl bg-slate-900/30 border border-dashed border-slate-800/80">
                    <div class="flex items-center gap-3 mb-4">
                      <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 font-mono font-bold">
                        ?
                      </div>
                      <div>
                        <h4 class="text-xl font-bold text-white">Project X</h4>
                        <span class="text-xs font-mono text-cyan-400 flex items-center gap-1">
                          <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span> В активной разработке / Secret
                        </span>
                      </div>
                    </div>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6">
                      Новый конфиденциальный продукт студии NomaByte. Раскроем подробности и функционал сразу после завершения стадии бета-тестирования.
                    </p>
                    <div class="flex items-center gap-3">
                      <span class="px-3 py-1 rounded-md bg-slate-900 text-slate-500 font-mono text-xs">Flutter</span>
                      <span class="px-3 py-1 rounded-md bg-slate-900 text-slate-500 font-mono text-xs">AI Integration</span>
                    </div>
                  </div>

                </div>

              </div>
            </section>

            {/* Contact Section */}
            <section id="contact" class="py-20 border-t border-slate-800/60">
              <div class="max-w-3xl mx-auto">
                <div class="text-center mb-12">
                  <h2 class="font-mono text-xs text-cyan-400 tracking-widest uppercase mb-2">// GET IN TOUCH</h2>
                  <h3 class="text-3xl md:text-5xl font-extrabold text-white mb-4">Написать нам</h3>
                  <p class="text-slate-400 text-sm">
                    Выберите удобный способ связи или отправьте нам прямое сообщение:
                  </p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
                  {/* Telegram */}
                  <a
                    href="https://t.me/nomabytestudio"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-cyan-500/50 hover:bg-slate-900 transition-all flex items-center justify-between group"
                  >
                    <div class="flex items-center gap-4">
                      <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 font-bold font-mono group-hover:scale-110 transition-transform">
                        TG
                      </div>
                      <div>
                        <div class="font-bold text-white">Telegram</div>
                        <div class="text-xs font-mono text-slate-400">@nomabytestudio</div>
                      </div>
                    </div>
                    <span class="text-cyan-400 font-mono text-lg group-hover:translate-x-1 transition-transform">&rarr;</span>
                  </a>

                  {/* Instagram */}
                  <div class="p-5 rounded-2xl bg-slate-900/30 border border-slate-800/60 flex items-center justify-between opacity-60">
                    <div class="flex items-center gap-4">
                      <div class="w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400 font-bold font-mono">
                        IG
                      </div>
                      <div>
                        <div class="font-bold text-white">Instagram</div>
                        <div class="text-xs font-mono text-purple-400">Скоро / Coming Soon</div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Email Form */}
                <form onSubmit={handleFormSubmit} class="p-8 rounded-3xl bg-slate-900/40 border border-slate-800 space-y-5">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                      <label class="block font-mono text-xs text-slate-400 mb-2">ВАШЕ ИМЯ</label>
                      <input
                        type="text"
                        required
                        placeholder="Alexandr"
                        value={formData.name}
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors text-sm"
                      />
                    </div>
                    <div>
                      <label class="block font-mono text-xs text-slate-400 mb-2">EMAIL</label>
                      <input
                        type="email"
                        required
                        placeholder="name@domain.com"
                        value={formData.email}
                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                        class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors text-sm"
                      />
                    </div>
                  </div>

                  <div>
                    <label class="block font-mono text-xs text-slate-400 mb-2">СООБЩЕНИЕ</label>
                    <textarea
                      rows="4"
                      required
                      placeholder="Расскажите о вашей идее..."
                      value={formData.message}
                      onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                      class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors text-sm resize-none"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    class="w-full py-4 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-cyan-500/20 font-mono"
                  >
                    SEND_MESSAGE &rarr;
                  </button>

                  {submitted && (
                    <div class="p-4 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-300 text-xs font-mono text-center">
                      ✓ Сообщение успешно отправлено! Мы свяжемся с вами в ближайшее время.
                    </div>
                  )}
                </form>
              </div>
            </section>

          </main>

          {/* Privacy Policy Modal */}
          {showPrivacy && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-800 max-w-3xl w-full max-h-[85vh] rounded-3xl p-6 md:p-8 overflow-y-auto relative shadow-2xl">
                <button
                  onClick={() => setShowPrivacy(false)}
                  class="absolute top-6 right-6 w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center font-mono font-bold"
                >
                  ✕
                </button>

                <h2 class="text-2xl font-bold text-white mb-2">Zásady ochrany osobných údajov</h2>
                <div class="text-xs font-mono text-cyan-400 mb-6 space-y-1">
                  <div>Aplikácia: Vodičák SK</div>
                  <div>Vývojár: NomaByte</div>
                  <div>Dátum účinnosti: 16. október 2026</div>
                </div>

                <div class="text-slate-300 text-sm space-y-6 leading-relaxed">
                  <p>
                    Aplikácia Vodičák SK (ďalej len „aplikácia“) rešpektuje vaše súkromie. Tieto Zásady ochrany osobných údajov vysvetľujú, aké údaje zhromažďujeme, ako ich používame a aké máte práva v súvislosti s vašimi osobnými údajmi.
                  </p>

                  <div>
                    <h3 class="font-bold text-white mb-2">1. Aké údaje zhromažďujeme</h3>
                    <p class="mb-3">Aplikácia využívá služby tretích strán na zabezpečenie správneho fungovania, analýzy a zobrazovania reklám.</p>
                    
                    <div class="space-y-3 pl-3 border-l-2 border-cyan-500/40">
                      <div>
                        <strong class="text-slate-100">a) Anonymná identifikácia a používateľský účet</strong>
                        <ul class="list-disc pl-5 mt-1 space-y-1 text-slate-400 text-xs">
                          <li><strong>Firebase Authentication:</strong> Používame anonymnú autentifikáciu. Vytvára sa unikátne ID používateľa (UID), ktoré neobsahuje vaše meno, e-mail ani telefónne číslo.</li>
                          <li><strong>Firestore Database:</strong> Zhromažďujeme anonymné dáta týkajúce sa vášho pokroku v testoch (napr. úspešnosť, vyriešené otázky) a stav predplatného (isPremium).</li>
                        </ul>
                      </div>

                      <div>
                        <strong class="text-slate-100">b) Automaticky zhromažďované údaje (Služby tretích strán)</strong>
                        <p class="text-xs text-slate-400 mt-1">Služby tretích strán môžu zhromažďovať informácie používané na vašu identifikáciu:</p>
                        <ul class="list-disc pl-5 mt-1 space-y-1 text-slate-400 text-xs">
                          <li>Google Play Services</li>
                          <li><strong>Google AdMob (na zobrazovanie reklám):</strong> Môže zhromažďovať reklamný identifikátor zariadenia (Advertising ID), IP adresu a dáta o interakcii s reklamami.</li>
                          <li><strong>Firebase Analytics / Crashlytics:</strong> Zhromažďuje anonymné údaje o používaní aplikácie a hlásenia o chybách (pádoch aplikácie).</li>
                        </ul>
                      </div>
                    </div>
                  </div>

                  <div>
                    <h3 class="font-bold text-white mb-2">2. Ako používame zhromaždené údaje</h3>
                    <ul class="list-disc pl-5 space-y-1 text-slate-300 text-xs">
                      <li>Zabezpečenie funkčnosti aplikácie a ukladanie vášho pokroku v testoch.</li>
                      <li>Správu a overenie prémiového prístupu (nákupy v aplikácii cez Google Play Billing).</li>
                      <li>Zobrazovanie relevantných reklám (pre neplatenej verzii).</li>
                      <li>Zlepšovanie stability a výkonu aplikácie na základe anonymných hlásení o chybách.</li>
                    </ul>
                  </div>

                  <div>
                    <h3 class="font-bold text-white mb-2">3. Zdieľanie údajov s tretími stranami</h3>
                    <p>
                      Vaše osobné údaje nepredávame ani neprenášame tretím stranám na marketingové účely. Dáta sú spracovávané iba prostredníctvom overených služieb spoločnosti Google (Google Privacy Policy, Google AdMob Privacy).
                    </p>
                  </div>

                  <div>
                    <h3 class="font-bold text-white mb-2">4. Nákupy v aplikácii (Google Play Billing)</h3>
                    <p>
                      Všetky finančné transakcie a spracovanie platieb prebiehajú bezpečne cez systém Google Play Commerce. Aplikácia Vodičák SK ani vývojár NomaByte nemajú prístup k vašim platobným kartám ani bankovým údajom. Ukladáme iba informáciu o tom, či je prémiový účet aktívny.
                    </p>
