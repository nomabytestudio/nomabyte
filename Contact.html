<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — NomaByte Studio</title>
  
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #050608; color: #f1f5f9; overflow-x: hidden; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }

    #rainCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
    }
  </style>
</head>
<body class="selection:bg-cyan-500/35 selection:text-cyan-300">

  <!-- Canvas дождя -->
  <canvas id="rainCanvas"></canvas>

  <!-- React корень -->
  <div id="contact-root" class="relative z-10"></div>

  <!-- Скрипт дождя -->
  <script>
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const drops = [];
    for (let i = 0; i < 90; i++) {
      drops.push({
        x: Math.random() * width,
        y: Math.random() * height,
        length: Math.random() * 20 + 10,
        speed: Math.random() * 7 + 3,
        opacity: Math.random() * 0.3 + 0.1
      });
    }

    function drawRain() {
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        ctx.beginPath();
        ctx.globalAlpha = d.opacity;
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - d.length * 0.1, d.y + d.length);
        ctx.stroke();

        d.y += d.speed;
        d.x -= d.speed * 0.1;

        if (d.y > height) {
          d.y = -20;
          d.x = Math.random() * width;
        }
      }
      requestAnimationFrame(drawRain);
    }
    drawRain();
  </script>

  <!-- React Компонент -->
  <script type="text/babel">
    const { useState } = React;

    function ContactApp() {
      const [loading, setLoading] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [form, setForm] = useState({ name: '', email: '', message: '' });

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await fetch("https://formspree.io/f/mwlvypbn", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              subject: "💬 Message from Contact Page (nomabyte.com/contact.html)",
              name: form.name,
              email: form.email,
              message: form.message
            })
          });
          if (res.ok) {
            setSubmitted(true);
            setForm({ name: '', email: '', message: '' });
            setTimeout(() => setSubmitted(false), 6000);
          }
        } catch (err) {
          alert("Connection error. Please try via Telegram.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="min-h-screen flex flex-col justify-between">
          
          {/* Шапка */}
          <header class="border-b border-slate-800/80 bg-[#050608]/90 backdrop-blur-md sticky top-0 z-40">
            <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
              <a href="index.html" class="flex items-center gap-2 font-mono-code text-xs md:text-sm tracking-wider text-slate-300 hover:text-cyan-400 transition-colors">
                <span>&larr;</span>
                <span>Back to Home</span>
              </a>
              <div class="flex items-center gap-2 font-mono-code text-xs text-cyan-400 font-bold">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span>// CONTACT HUB</span>
              </div>
            </div>
          </header>

          {/* Контент формы */}
          <main class="max-w-2xl mx-auto px-6 py-16 w-full">
            <div class="text-center mb-10">
              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-cyan-500/30 bg-cyan-950/40 text-cyan-400 text-xs font-mono-code mb-4">
                AVAILABLE FOR NEW PROJECTS & INQUIRIES
              </div>
              <h1 class="text-4xl md:text-6xl font-black text-white tracking-tight mb-4">
                Get in <span class="text-cyan-400">Touch</span>
              </h1>
              <p class="text-slate-400 text-sm font-mono-code">
                Have a mobile app idea, need support, or want to collaborate? Drop us a line.
              </p>
            </div>

            {/* Telegram блок */}
            <div class="mb-8">
              <a
                href="https://t.me/nomabytestudio"
                target="_blank"
                rel="noopener noreferrer"
                class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-cyan-500/50 transition-all flex items-center justify-between group backdrop-blur-sm"
              >
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 font-bold font-mono-code">TG</div>
                  <div>
                    <div class="font-bold text-white text-sm">Telegram Direct Support</div>
                    <div class="text-xs font-mono-code text-slate-400">@nomabytestudio • Fast response</div>
                  </div>
                </div>
                <span class="text-cyan-400 font-mono-code text-lg group-hover:translate-x-1 transition-transform">&rarr;</span>
              </a>
            </div>

            {/* Форма */}
            <form onSubmit={handleSubmit} class="p-8 rounded-3xl bg-slate-900/50 border border-slate-800 space-y-5 backdrop-blur-md shadow-2xl">
              <div>
                <label class="block font-mono-code text-xs text-slate-400 mb-2">YOUR NAME</label>
                <input
                  type="text"
                  required
                  placeholder="Alexandr"
                  value={form.name}
                  onChange={(e) => setForm({ ...form, name: e.target.value })}
                  class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 text-sm"
                />
              </div>

              <div>
                <label class="block font-mono-code text-xs text-slate-400 mb-2">YOUR EMAIL</label>
                <input
                  type="email"
                  required
                  placeholder="name@domain.com"
                  value={form.email}
                  onChange={(e) => setForm({ ...form, email: e.target.value })}
                  class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 text-sm"
                />
              </div>

              <div>
                <label class="block font-mono-code text-xs text-slate-400 mb-2">YOUR MESSAGE</label>
                <textarea
                  rows="5"
                  required
                  placeholder="Describe your project, question or proposal..."
                  value={form.message}
                  onChange={(e) => setForm({ ...form, message: e.target.value })}
                  class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500 text-sm resize-none"
                ></textarea>
              </div>

              <button
                type="submit"
                disabled={loading}
                class="w-full py-4 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition-all font-mono-code disabled:opacity-50 shadow-lg shadow-cyan-500/20"
              >
                {loading ? 'SENDING...' : 'SEND MESSAGE →'}
              </button>

              {submitted && (
                <div class="p-4 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-300 text-xs font-mono-code text-center">
                  ✓ Message sent successfully! We will get back to you soon.
                </div>
              )}
            </form>
          </main>

          {/* Футер */}
          <footer class="border-t border-slate-800/80 py-8 bg-[#030406]">
            <div class="max-w-4xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 font-mono-code text-xs text-slate-500">
              <div>© 2026 NomaByte Studio. All rights reserved.</div>
              <div class="flex items-center gap-6">
                <a href="Privacypolicy.html" class="hover:text-cyan-400 transition-colors">Privacy Policy</a>
                <span>•</span>
                <a href="dashboard.html" class="hover:text-amber-400 transition-colors">Tester Portal</a>
                <span>•</span>
                <span>Bratislava, SK</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('contact-root')).render(<ContactApp />);
  </script>
</body>
</html>
