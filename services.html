                  <div class="font-mono-code text-xs text-blue-400">{t.appTag}</div>
                  <h2 class="text-3xl md:text-4xl font-black text-white">{t.appTitle}</h2>
                  <p class="text-slate-300 text-sm leading-relaxed">
                    {t.appStory}
                  </p>

                  <ul class="space-y-2.5 pt-2">
                    {t.appFeatures.map((feat, i) => (
                      <li key={i} class="flex items-start gap-2.5 text-xs md:text-sm text-slate-300">
                        <span class="text-cyan-400 font-bold mt-0.5">✓</span>
                        <span>{feat}</span>
                      </li>
                    ))}
                  </ul>

                  <div class="pt-4 flex flex-wrap items-center gap-4">
                    <a
                      href="https://play.google.com/store/search?q=Vodi%C4%8D%C3%A1k%20SK&c=apps"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="px-6 py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs font-mono-code transition-all shadow-lg shadow-blue-600/25"
                    >
                      {t.btnGooglePlay}
                    </a>
                    <a
                      href="dashboard.html"
                      class="px-5 py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-cyan-300 font-bold text-xs font-mono-code transition-all"
                    >
                      {t.btnTestBeta}
                    </a>
                  </div>
                </div>

                {/* Правая колонка: Визуальные скриншоты интерфейса приложения */}
                <div class="lg:col-span-5 flex justify-center gap-4">
                  {/* Экран 1: Главный экран тренажера */}
                  <div class="w-44 h-80 rounded-3xl bg-slate-950 border-2 border-slate-700 p-2.5 shadow-2xl flex flex-col justify-between -rotate-2">
                    <div class="bg-gradient-to-r from-blue-600 to-cyan-600 rounded-2xl p-3 text-white">
                      <div class="text-[9px] font-mono-code opacity-80">NOMABYTE STUDIO</div>
                      <div class="font-bold text-xs mt-0.5">Vodičák SK</div>
                      <div class="mt-2 bg-black/25 rounded-lg px-2 py-1 text-[9px] font-mono-code">Readiness: 94%</div>
                    </div>
                    <div class="space-y-2 my-auto py-2">
                      <div class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-[10px]">
                        <div class="text-cyan-400 font-bold">📝 Skúšobný test</div>
                        <div class="text-slate-500 text-[9px]">20 otázok • 20 min</div>
                      </div>
                      <div class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-[10px]">
                        <div class="text-amber-400 font-bold">⚠️ Dopravné značky</div>
                        <div class="text-slate-500 text-[9px]">Kompletný prehľad</div>
                      </div>
                      <div class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-[10px]">
                        <div class="text-emerald-400 font-bold">📊 Moje chyby</div>
                        <div class="text-slate-500 text-[9px]">Opakovanie otázok</div>
                      </div>
                    </div>
                    <div class="text-center text-[8px] font-mono-code text-slate-600">UI SCREENSHOT #1</div>
                  </div>

                  {/* Экран 2: Режим экзамена */}
                  <div class="w-44 h-80 rounded-3xl bg-slate-950 border-2 border-cyan-500/40 p-2.5 shadow-2xl flex flex-col justify-between translate-y-4 rotate-2">
                    <div class="flex items-center justify-between px-1 pt-1">
                      <span class="text-[9px] font-mono-code text-cyan-400">OTÁZKA 14/20</span>
                      <span class="text-[9px] font-mono-code text-emerald-400">12:45</span>
                    </div>
                    <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-[10px] text-slate-200 leading-snug">
                      Kto má prednosť v jazde na križovatke nerozlíšenej dopravnými značkami?
                    </div>
                    <div class="space-y-1.5 text-[9px]">
                      <div class="p-2 rounded-lg bg-emerald-950/70 border border-emerald-500 text-emerald-300 font-semibold">
                        ✓ Vozidlo prichádzajúce sprava
                      </div>
                      <div class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-400">
                        Vozidlo idúce rovno
                      </div>
                    </div>
                    <div class="text-center text-[8px] font-mono-code text-slate-600">UI SCREENSHOT #2</div>
                  </div>
                </div>

              </div>
            </section>

            {/* 4. ИСТОРИЯ ОСНОВАНИЯ СТУДИИ (TIMELINE) */}
            <section id="our-story" class="space-y-10">
              <div class="max-w-3xl">
                <div class="font-mono-code text-xs text-cyan-400 tracking-widest uppercase mb-2">{t.storyTag}</div>
                <h2 class="text-3xl md:text-5xl font-extrabold text-white mb-4">{t.storyTitle}</h2>
                <p class="text-slate-300 text-sm md:text-base leading-relaxed mb-3">{t.storyText1}</p>
                <p class="text-slate-400 text-sm leading-relaxed">{t.storyText2}</p>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                {t.milestones.map((m, idx) => (
                  <div key={idx} class="glass-card rounded-3xl p-6 border-t-2 border-t-cyan-400 space-y-3">
                    <span class="inline-block px-3 py-1 rounded-lg bg-cyan-500/10 text-cyan-400 font-mono-code text-xs font-bold">
                      {m.year}
                    </span>
                    <h3 class="text-lg font-bold text-white">{m.title}</h3>
                    <p class="text-xs md:text-sm text-slate-400 leading-relaxed">{m.desc}</p>
                  </div>
                ))}
              </div>
            </section>

            {/* 5. ФОРМА ЗАКАЗА УСЛУГ / КОНСУЛЬТАЦИИ */}
            <section id="order-form" class="max-w-3xl mx-auto pt-6">
              <div class="glass-card rounded-3xl p-7 md:p-10 border-cyan-500/30 shadow-2xl">
                <div class="text-center mb-8">
                  <div class="font-mono-code text-xs text-cyan-400 tracking-widest uppercase mb-2">{t.orderTag}</div>
                  <h2 class="text-2xl md:text-4xl font-black text-white mb-2">{t.orderTitle}</h2>
                  <p class="text-xs md:text-sm text-slate-400">{t.orderSub}</p>
                </div>

                <form onSubmit={handleOrderSubmit} class="space-y-5">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                      <label class="block font-mono-code text-xs text-slate-400 mb-2">{t.labelService}</label>
                      <select
                        value={selectedService}
                        onChange={(e) => setSelectedService(e.target.value)}
                        class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-cyan-300 font-semibold text-sm focus:outline-none focus:border-cyan-400"
                      >
                        <option value="Mobile App (iOS & Android)">📱 Mobile App (iOS & Android)</option>
                        <option value="Website / Web Platform">🌐 Website / Web Platform</option>
                        <option value="Custom Software & Automation">⚙️ Custom Software / Bot / Script</option>
                        <option value="IT Consultation & Store Launch">💡 IT Consultation / Advice</option>
                      </select>
                    </div>

                    <div>
                      <label class="block font-mono-code text-xs text-slate-400 mb-2">{t.labelBudget}</label>
                      <select
                        value={budget}
                        onChange={(e) => setBudget(e.target.value)}
                        class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-400"
                      >
                        <option value="$25 – $60 (Consultation / Small Task)">$5 – $60 (Consultation / Small Task)</option>
                        <option value="$100 – $300 (Website / MVP)">$100 – $300 (Website / MVP)</option>
                        <option value="$300 – $800 (Full Mobile App)">$300 – $800 (Full Mobile App)</option>
                        <option value="$800+ (Complex Platform)">$800+ (Complex Platform)</option>
                      </select>
                    </div>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                      <label class="block font-mono-code text-xs text-slate-400 mb-2">{t.labelName}</label>
                      <input
                        type="text"
                        required
                        placeholder="Alexandr"
                        value={name}
                        onChange={(e) => setName(e.target.value)}
                        class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-400"
                      />
                    </div>
                    <div>
                      <label class="block font-mono-code text-xs text-slate-400 mb-2">{t.labelContact}</label>
                      <input
                        type="text"
                        required
                        placeholder="name@email.com or @telegram"
                        value={contact}
                        onChange={(e) => setContact(e.target.value)}
                        class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-400"
                      />
                    </div>
                  </div>

                  <div>
                    <label class="block font-mono-code text-xs text-slate-400 mb-2">{t.labelDetails}</label>
                    <textarea
                      rows="4"
                      required
                      placeholder="Describe your idea, features, deadlines, or question..."
                      value={details}
                      onChange={(e) => setDetails(e.target.value)}
                      class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-400 resize-none"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    disabled={loading}
                    class="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-slate-950 font-bold text-sm font-mono-code transition-all shadow-lg shadow-cyan-500/20 disabled:opacity-50"
                  >
                    {loading ? t.btnSending : t.btnSubmit}
                  </button>

                  {submitted && (
                    <div class="p-4 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-300 text-xs font-mono-code text-center">
                      {t.successMsg}
                    </div>
                  )}
                </form>
              </div>
            </section>

          </main>

          {/* Футер */}
          <footer class="border-t border-slate-800/80 py-8 bg-[#030406] mt-16">
            <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 font-mono-code text-xs text-slate-500">
              <div>© 2026 NomaByte Studio • Bratislava, SK</div>
              <div class="flex items-center gap-6 flex-wrap justify-center">
                <a href="index.html" class="hover:text-cyan-400 transition-colors">Home</a>
                <a href="Privacypolicy.html" class="hover:text-cyan-400 transition-colors">Privacy & Rules</a>
                <a href="dashboard.html" class="hover:text-amber-400 transition-colors">Tester Hub</a>
                <a href="contact.html" class="hover:text-cyan-400 transition-colors">Contact</a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('services-root')).render(<ServicesApp />);
  </script>
</body>
</html>
