<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NomaByte Dashboard - Bug Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 100px; }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0369a1; }
        .status { margin-top: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🐛 Сообщить об ошибке</h2>
        <form id="bugForm">
            <label for="bugDescription">Опишите проблему:</label>
            <textarea id="bugDescription" placeholder="Что пошло не так?..." required></textarea>

            <label for="bugScreenshot">Прикрепить скриншот (необязательно):</label>
            <input type="file" id="bugScreenshot" accept="image/*">

            <button type="submit" id="submitBtn">Отправить в Telegram</button>
        </form>
        <div id="statusMessage" class="status"></div>
    </div>

    <script>
        const BOT_TOKEN = '9276816295:AAHCW8XsdT2FMHT2zt_h_qs77pNFE_f4lAC'; //[span_2](start_span)[span_2](end_span)
        const CHAT_ID = '5044411049'; //

        document.getElementById('bugForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const description = document.getElementById('bugDescription').value;
            const fileInput = document.getElementById('bugScreenshot');
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('statusMessage');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';
            statusDiv.textContent = '';

            try {
                let response;
                
                if (fileInput.files.length > 0) {
                    // Если пользователь прикрепил скриншот
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', fileInput.files[0]);
                    formData.append('caption', `🐛 **Новый баг-репорт:**\n\n${description}`);

                    response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    // Если только текст
                    response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: `🐛 **Новый баг-репорт:**\n\n${description}`,
                            parse_mode: 'Markdown'
                        })
                    });
                }

                const data = await response.json();

                if (data.ok) {
                    statusDiv.style.color = '#4ade80';
                    statusDiv.textContent = '✅ Баг успешно отправлен в Telegram!';
                    document.getElementById('bugForm').reset();
                } else {
                    throw new Error(data.description || 'Ошибка сервера Telegram');
                }
            } catch (error) {
                console.error(error);
                statusDiv.style.color = '#f87171';
                statusDiv.textContent = '❌ Ошибка при отправке. Попробуйте еще раз.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить в Telegram';
            }
        });
    </script>
</body>
</html>
