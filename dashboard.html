<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NomaByte Tester Hub — Dashboard</title>
  
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #050608; color: #f1f5f9; overflow-x: hidden; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }

    /* Интро-анимация перехода STUDIO -> TESTER HUB как на видео */
    #hubIntro {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #081226 0%, #030407 100%);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    #hubIntro.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .net-line {
      stroke: url(#hubGrad);
      stroke-width: 5.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 450;
      stroke-dashoffset: 450;
      animation: drawNet 0.9s cubic-bezier(.5,0,.2,1) forwards;
    }
    .net-node {
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(0);
      animation: popNode 0.5s cubic-bezier(.3,1.6,.5,1) forwards;
    }
    .net-halo {
      fill: #38bdf8;
      opacity: 0;
      filter: blur(16px);
      animation: pulseHalo 2.5s ease-in-out infinite alternate;
    }
    .spark {
      fill: #ffffff;
      filter: drop-shadow(0 0 6px #38bdf8);
      opacity: 0;
      animation: sparkTravel 1.6s ease-in-out infinite;
    }

    /* Эффект RGB-глитча как на 00:04.5 видео */
    .glitch-layer {
      animation: rgbGlitch 0.45s cubic-bezier(.25,.46,.45,.94) 1.5s both;
    }
    .title-studio {
      animation: hideStudio 0.15s steps(1) 1.75s forwards;
    }
    .title-hub {
      opacity: 0;
      animation: showHub 0.4s ease-out 1.8s forwards;
    }
    .title-url {
      opacity: 0;
      animation: showHub 0.5s ease-out 2.1s forwards;
    }

    @keyframes drawNet { to { stroke-dashoffset: 0; } }
    @keyframes popNode { to { transform: scale(1); } }
    @keyframes pulseHalo { 0% { opacity: 0.35; } 100% { opacity: 0.75; } }
    @keyframes sparkTravel {
      0% { opacity: 0; transform: translate(0, 0); }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translate(45px, 65px); }
    }
    @keyframes rgbGlitch {
      0% { transform: translate(0); filter: drop-shadow(0 0 0 transparent); }
      20% { transform: translate(-6px, 2px) skewX(-5deg); filter: drop-shadow(5px 0 0 #ef4444) drop-shadow(-5px 0 0 #06b6d4); }
      40% { transform: translate(6px, -2px) skewX(5deg); filter: drop-shadow(-5px 0 0 #ef4444) drop-shadow(5px 0 0 #3b82f6); }
      60% { transform: translate(-4px, -1px); filter: drop-shadow(4px 0 0 #ec4899) drop-shadow(-4px 0 0 #22d3ee); }
      80% { transform: translate(3px, 1px); }
      100% { transform: translate(0); filter: drop-shadow(0 0 0 transparent); }
    }
    @keyframes hideStudio { to { opacity: 0; } }
    @keyframes showHub { to { opacity: 1; } }

    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.7);
    }
  </style>
</head>
<body class="selection:bg-cyan-500/30 selection:text-cyan-300">

  <!-- Анимация интро как на прикрепленном видео -->
  <div id="hubIntro">
    <svg viewBox="420 90 560 590" style="width: min(92vw, 490px); height: auto; overflow: visible;">
      <defs>
        <linearGradient id="hubGrad" gradientUnits="userSpaceOnUse" x1="577" y1="431" x2="831" y2="154">
          <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/>
        </linearGradient>
        <radialGradient id="nodeBlue"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0284c7"/></radialGradient>
        <radialGradient id="nodeBright"><stop offset="0" stop-color="#f0f9ff"/><stop offset="1" stop-color="#38bdf8"/></radialGradient>
        <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#bae6fd"/><stop offset="1" stop-color="#3b82f6"/>
        </linearGradient>
      </defs>

      <g class="glitch-layer">
        <!-- Свечение узлов -->
        <circle class="net-halo" cx="577" cy="159" r="32"/>
        <circle class="net-halo" cx="831" cy="154" r="34"/>
        <circle class="net-halo" cx="577" cy="431" r="32"/>
        <circle class="net-halo" cx="832" cy="430" r="32"/>

        <!-- Грани сети -->
        <path class="net-line" style="animation-delay:0.2s" d="M577 159 L577 431"/>
        <path class="net-line" style="animation-delay:0.25s" d="M831 154 L832 430"/>
        <path class="net-line" style="animation-delay:0.35s" d="M577 159 L832 430"/>
        <path class="net-line" style="animation-delay:0.4s" d="M831 154 L577 431"/>
        <path class="net-line" style="animation-delay:0.5s" d="M577 159 L667 333 L832 430"/>
        <path class="net-line" style="animation-delay:0.55s" d="M577 431 L640 283"/>
        <path class="net-line" style="animation-delay:0.6s" d="M577 159 Q700 222 740 252 L832 430"/>
        <path class="net-line" style="animation-delay:0.65s" d="M831 154 L771 303"/>

        <!-- Бегущие световые импульсы -->
        <circle class="spark" style="animation-delay:1.9s" cx="620" cy="210" r="3.5"/>
        <circle class="spark" style="animation-delay:2.2s" cx="730" cy="240" r="3.5"/>
        <circle class="spark" style="animation-delay:2.5s" cx="680" cy="310" r="3.5"/>

        <!-- Узлы -->
        <circle class="net-node" style="animation-delay:0.05s" cx="577" cy="159" r="22" fill="url(#nodeBlue)"/>
        <circle class="net-node" style="animation-delay:0.1s" cx="831" cy="154" r="24" fill="url(#nodeBright)"/>
        <circle class="net-node" style="animation-delay:0.15s" cx="577" cy="431" r="22" fill="url(#nodeBlue)"/>
        <circle class="net-node" style="animation-delay:0.2s" cx="832" cy="430" r="22" fill="url(#nodeBlue)"/>

        <!-- Текст NomaByte -->
        <text x="700" y="555" text-anchor="middle" font-weight="800" font-size="88" fill="url(#textGrad)" letter-spacing="-1">NomaByte</text>
        
        <!-- Переключение STUDIO -> TESTER HUB -->
        <text class="title-studio" x="700" y="610" text-anchor="middle" font-weight="700" font-size="30" fill="#3b82f6" letter-spacing="8">STUDIO</text>
        <text class="title-hub" x="700" y="610" text-anchor="middle" font-weight="700" font-size="30" fill="#38bdf8" letter-spacing="7">TESTER HUB</text>
        <text class="title-url font-mono-code" x="700" y="648" text-anchor="middle" font-size="14" fill="#64748b" letter-spacing="1">nomabyte.com/dashboard.html</text>
      </g>
    </svg>
  </div>

  <!-- React Корень -->
  <div id="dashboard-root"></div>

  <script>
    setTimeout(() => {
      const intro = document.getElementById('hubIntro');
      if (intro) intro.classList.add('fade-out');
    }, 3400);
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Предустановленные аккаунты
    const DEFAULT_USERS = [
      { name: "Alex Admin", email: "alex@nomabyte.com", password: "noma2026_admin", role: "admin" },
      { name: "Beta Tester 1", email: "tester1@nomabyte.com", password: "noma2026_tester1", role: "tester" },
      { name: "Beta Tester 2", email: "tester2@nomabyte.com", password: "noma2026_tester2", role: "tester" }
    ];

    function DashboardApp() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authTab, setAuthTab] = useState('login'); // 'login' | 'register'
      const [activeSection, setActiveSection] = useState('builds'); // 'builds' | 'bug' | 'admin'

      // Состояния формы входа
      const [loginData, setLoginData] = useState({ email: '', password: '' });
      const [loginError, setLoginError] = useState('');

      // Состояния формы регистрации
      const [regData, setRegData] = useState({
        name: '',
        email: '',
        password: '',
        device: '',
        wantsAdmin: false,
        adminReason: ''
      });
      const [regLoading, setRegLoading] = useState(false);
      const [adminPendingNotice, setAdminPendingNotice] = useState(false);

      // Отчет о баге
      const [bugSubmitted, setBugSubmitted] = useState(false);

      // Загрузка сессии и зарегистрированных пользователей
      useEffect(() => {
        const savedSession = sessionStorage.getItem('nomabyte_hub_user');
        if (savedSession) {
          setCurrentUser(JSON.parse(savedSession));
        }
      }, []);

      const getAllUsers = () => {
        const stored = JSON.parse(localStorage.getItem('nomabyte_registered_testers') || '[]');
        return [...DEFAULT_USERS, ...stored];
      };

      // Вход в систему
      const handleLogin = (e) => {
        e.preventDefault();
        const users = getAllUsers();
        const found = users.find(
          u => u.email.toLowerCase().trim() === loginData.email.toLowerCase().trim() && u.password === loginData.password
        );
        if (found) {
          setCurrentUser(found);
          sessionStorage.setItem('nomabyte_hub_user', JSON.stringify(found));
          setLoginError('');
        } else {
          setLoginError('Invalid email or password. If you requested Admin access, wait for owner approval.');
        }
      };

      // Регистрация нового тестера / запрос админки
      const handleRegister = async (e) => {
        e.preventDefault();
        setRegLoading(true);

        const users = getAllUsers();
        if (users.some(u => u.email.toLowerCase() === regData.email.toLowerCase().trim())) {
          alert('This email is already registered. Please sign in.');
          setRegLoading(false);
          return;
        }

        if (regData.wantsAdmin) {
          // ЕСЛИ ПОЛЬЗОВАТЕЛЬ ХОЧЕТ АДМИНКУ:
          // Аккаунт НЕ открывается! Отправляется уведомление владельцу через Formspree
          try {
            await fetch("https://formspree.io/f/mwlvypbn", {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify({
                subject: "🚨 ЗАПРОС НА АДМИН-АККАУНТ (NomaByte Tester Hub)",
                applicant_name: regData.name,
                applicant_email: regData.email,
                device: regData.device,
                reason_for_admin: regData.adminReason || "Not specified",
                status: "ACCESS BLOCKED — Awaiting owner approval"
              })
            });
          } catch (err) {
            console.error(err);
          } finally {
            setRegLoading(false);
            setAdminPendingNotice(true);
          }
          return;
        }

        // ЕСЛИ ОБЫЧНЫЙ ТЕСТЕР — регистрируем и сразу пускаем в кабинет
        const newTester = {
          name: regData.name.trim(),
          email: regData.email.trim(),
          password: regData.password,
          device: regData.device,
          role: 'tester'
        };

        const stored = JSON.parse(localStorage.getItem('nomabyte_registered_testers') || '[]');
        stored.push(newTester);
        localStorage.setItem('nomabyte_registered_testers', JSON.stringify(stored));

        // Уведомляем владельца о новом тестерe в фоне
        fetch("https://formspree.io/f/mwlvypbn", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            subject: "✅ Новый бета-тестер зарегистрировался в Tester Hub",
            tester_name: newTester.name,
            tester_email: newTester.email,
            device: newTester.device
          })
        }).catch(() => {});

        setRegLoading(false);
        setCurrentUser(newTester);
        sessionStorage.setItem('nomabyte_hub_user', JSON.stringify(newTester));
      };

      const handleLogout = () => {
        setCurrentUser(null);
        sessionStorage.removeItem('nomabyte_hub_user');
      };

      return (
        <div class="min-h-screen flex flex-col justify-between bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#050608] to-[#030406]">
          
          {/* Верхняя навигационная панель */}
          <header class="border-b border-slate-800/80 bg-[#050608]/80 backdrop-blur-xl sticky top-0 z-40">
            <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
              <a href="index.html" class="flex items-center gap-2.5 font-mono-code text-xs md:text-sm text-slate-300 hover:text-cyan-400 transition-colors group">
                <span class="w-7 h-7 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center group-hover:border-cyan-500/50 transition-all">&larr;</span>
                <span>nomabyte.com</span>
              </a>

              <div class="flex items-center gap-2.5">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                <span class="font-mono-code text-xs md:text-sm font-bold tracking-wider text-cyan-400">
                  NOMABYTE TESTER HUB
                </span>
              </div>
            </div>
          </header>

          {/* Основная рабочая область */}
          <main class="max-w-5xl mx-auto px-6 py-12 w-full flex-1 flex flex-col justify-center">
            
            {!currentUser ? (
              /* ЭКРАН АВТОРИЗАЦИИ И РЕГИСТРАЦИИ */
              <div class="max-w-md mx-auto w-full">
                
                {adminPendingNotice ? (
                  /* УВЕДОМЛЕНИЕ ПРИ ЗАПРОСЕ АДМИНКИ */
                  <div class="glass-card rounded-3xl p-8 text-center shadow-2xl border-amber-500/40 space-y-5">
                    <div class="w-16 h-16 rounded-2xl bg-amber-500/15 border border-amber-500/40 text-amber-400 flex items-center justify-center text-3xl mx-auto">
                      ⏳
                    </div>
                    <h2 class="text-2xl font-extrabold text-white">Admin Request Sent</h2>
                    <p class="text-sm text-slate-300 leading-relaxed">
                      Your request for an <strong>Administrator account</strong> (<span class="text-amber-400 font-mono-code">{regData.email}</span>) has been sent directly to the NomaByte Studio owner.
                    </p>
                    <div class="p-4 rounded-2xl bg-slate-950/80 border border-slate-800 text-xs font-mono-code text-slate-400">
                      Access to the dashboard remains locked until your admin privileges are manually verified and approved.
                    </div>
                    <button
                      type="button"
                      onClick={() => {
                        setAdminPendingNotice(false);
                        setAuthTab('login');
                        setRegData({ name: '', email: '', password: '', device: '', wantsAdmin: false, adminReason: '' });
                      }}
                      class="w-full py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-mono-code text-xs font-bold transition-all"
                    >
                      RETURN TO SIGN IN
                    </button>
                  </div>
                ) : (
                  /* КАРТОЧКА ВХОДА / РЕГИСТРАЦИИ */
                  <div class="glass-card rounded-3xl p-7 md:p-9 shadow-[0_25px_70px_-15px_rgba(6,182,212,0.2)]">
                    
                    <div class="text-center mb-7">
                      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-mono-code text-[11px] mb-3">
                        CLOSED BETA ENVIRONMENT
                      </div>
                      <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight">
                        {authTab === 'login' ? 'Welcome Back' : 'Create Tester ID'}
                      </h1>
                      <p class="text-xs text-slate-400 font-mono-code mt-1">
                        {authTab === 'login' ? 'Sign in to access beta builds & tools' : 'Register for instant beta portal access'}
                      </p>
                    </div>

                    {/* Переключатель Вход / Регистрация */}
                    <div class="grid grid-cols-2 p-1 rounded-2xl bg-slate-950 border border-slate-800 mb-6">
                      <button
                        type="button"
                        onClick={() => { setAuthTab('login'); setLoginError(''); }}
                        class={`py-2.5 rounded-xl font-mono-code text-xs font-bold transition-all ${
                          authTab === 'login'
                            ? 'bg-cyan-500 text-slate-950 shadow-md'
                            : 'text-slate-400 hover:text-white'
                        }`}
                      >
                        SIGN IN
                      </button>
                      <button
                        type="button"
                        onClick={() => { setAuthTab('register'); setLoginError(''); }}
                        class={`py-2.5 rounded-xl font-mono-code text-xs font-bold transition-all ${
                          authTab === 'register'
                            ? 'bg-cyan-500 text-slate-950 shadow-md'
                            : 'text-slate-400 hover:text-white'
                        }`}
                      >
                        REGISTER
                      </button>
                    </div>

                    {authTab === 'login' ? (
                      /* ФОРМА ВХОДА */
                      <form onSubmit={handleLogin} class="space-y-4">
                        <div>
                          <label class="block font-mono-code text-[11px] text-slate-400 mb-1.5">EMAIL ADDRESS</label>
                          <input
                            type="email"
                            required
                            placeholder="tester1@nomabyte.com"
                            value={loginData.email}
                            onChange={(e) => setLoginData({ ...loginData, email: e.target.value })}
                            class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-cyan-400 transition-colors"
                          />
                        </div>

                        <div>
                          <label class="block font-mono-code text-[11px] text-slate-400 mb-1.5">PASSWORD</label>
                          <input
                            type="password"
                            required
                            placeholder="••••••••"
                            value={loginData.password}
                            onChange={(e) => setLoginData({ ...loginData, password: e.target.value })}
                            class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-cyan-400 transition-colors"
                          />
                        </div>

                        {loginError && (
                          <div class="p-3.5 rounded-xl bg-rose-950/60 border border-rose-500/40 text-rose-300 text-xs font-mono-code leading-relaxed">
                            ✕ {loginError}
                          </div>
                        )}

                        <button
                          type="submit"
                          class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-slate-950 font-bold text-sm font-mono-code transition-all shadow-lg shadow-cyan-500/20 mt-2"
                        >
                          ENTER TESTER HUB →
                        </button>
                      </form>
                    ) : (
                      /* ФОРМА РЕГИСТРАЦИИ */
                      <form onSubmit={handleRegister} class="space-y-4">
                        <div>
                          <label class="block font-mono-code text-[11px] text-slate-400 mb-1">FULL NAME / NICKNAME</label>
                          <input
                            type="text"
                            required
                            placeholder="Alexandr"
                            value={regData.name}
                            onChange={(e) => setRegData({ ...regData, name: e.target.value })}
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-950/90 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-cyan-400"
                          />
                        </div>

                        <div>
                          <label class="block font-mono-code text-[11px] text-slate-400 mb-1">EMAIL ADDRESS</label>
                          <input
                            type="email"
                            required
                            placeholder="name@gmail.com"
                            value={regData.email}
                            onChange={(e) => setRegData({ ...regData, email: e.target.value })}
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-950/90 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-cyan-400"
                          />
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label class="block font-mono-code text-[11px] text-slate-400 mb-1">PASSWORD</label>
                            <input
                              type="password"
                              required
                              minLength="6"
                              placeholder="Min 6 chars"
                              value={regData.password}
                              onChange={(e) => setRegData({ ...regData, password: e.target.value })}
                              class="w-full px-4 py-2.5 rounded-xl bg-slate-950/90 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-cyan-400"
                            />
                          </div>
                          <div>
                            <label class="block font-mono-code text-[11px] text-slate-400 mb-1">TEST DEVICE</label>
                            <input
                              type="text"
                              required
                              placeholder="iPhone 16 / Android"
                              value={regData.device}
                              onChange={(e) => setRegData({ ...regData, device: e.target.value })}
                              class="w-full px-4 py-2.5 rounded-xl bg-slate-950/90 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-cyan-400"
                            />
                          </div>
                        </div>

                        {/* Опция запроса админки */}
                        <div class="p-3.5 rounded-2xl bg-slate-950/80 border border-slate-800 space-y-2.5">
                          <label class="flex items-center gap-3 cursor-pointer select-none">
                            <input
                              type="checkbox"
                              checked={regData.wantsAdmin}
                              onChange={(e) => setRegData({ ...regData, wantsAdmin: e.target.checked })}
                              class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-amber-500 focus:ring-0"
                            />
                            <span class="text-xs font-semibold text-amber-400">
                              🛡️ Request Admin Account (Админка)
                            </span>
                          </label>

                          {regData.wantsAdmin && (
                            <div class="space-y-2 pt-1">
                              <p class="text-[11px] text-slate-400 leading-tight">
                                Admin accounts require manual approval. Your account will not open immediately — a notification will be sent to the owner.
                              </p>
                              <input
                                type="text"
                                required
                                placeholder="Why do you need admin access?"
                                value={regData.adminReason}
                                onChange={(e) => setRegData({ ...regData, adminReason: e.target.value })}
                                class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-amber-500/40 text-slate-200 text-xs focus:outline-none"
                              />
                            </div>
                          )}
                        </div>

                        <button
                          type="submit"
                          disabled={regLoading}
                          class={`w-full py-3.5 rounded-xl font-bold text-sm font-mono-code transition-all shadow-lg ${
                            regData.wantsAdmin
                              ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-amber-500/20'
                              : 'bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-slate-950 shadow-cyan-500/20'
                          }`}
                        >
                          {regLoading
                            ? 'PROCESSING...'
                            : regData.wantsAdmin
                              ? 'SEND ADMIN REQUEST →'
                              : 'CREATE ACCOUNT & ENTER →'}
                        </button>
                      </form>
                    )}
                  </div>
                )}
              </div>
            ) : (
              /* ЛИЧНЫЙ КАБИНЕТ АВТОРИЗОВАННОГО ТЕСТЕРА */
              <div class="space-y-8">
                
                {/* Профиль пользователя */}
                <div class="glass-card rounded-3xl p-6 md:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-cyan-500/20">
                      {currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'T'}
                    </div>
                    <div>
                      <div class="flex items-center gap-2">
                        <span class="text-xs font-mono-code text-emerald-400">// ACTIVE SESSION</span>
                        <span class={`px-2 py-0.5 rounded text-[10px] font-mono-code font-bold uppercase ${
                          currentUser.role === 'admin' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40' : 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40'
                        }`}>
                          {currentUser.role}
                        </span>
                      </div>
                      <h2 class="text-xl md:text-2xl font-bold text-white">{currentUser.name || currentUser.email}</h2>
                      <p class="text-xs font-mono-code text-slate-400">{currentUser.email}</p>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={handleLogout}
                    class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-rose-950/50 border border-slate-700 hover:border-rose-500/50 text-xs font-mono-code text-slate-300 hover:text-rose-300 transition-all"
                  >
                    LOGOUT ↗
                  </button>
                </div>

                {/* Навигационные вкладки кабинета */}
                <div class="flex items-center gap-3 flex-wrap">
                  <button
                    type="button"
                    onClick={() => setActiveSection('builds')}
                    class={`px-5 py-2.5 rounded-xl font-mono-code text-xs font-bold transition-all ${
                      activeSection === 'builds'
                        ? 'bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/20'
                        : 'glass-card text-slate-300 hover:border-cyan-500/40'
                    }`}
                  >
                    📲 Beta Builds (2)
                  </button>
                  <button
                    type="button"
                    onClick={() => setActiveSection('bug')}
                    class={`px-5 py-2.5 rounded-xl font-mono-code text-xs font-bold transition-all ${
                      activeSection === 'bug'
                        ? 'bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/20'
                        : 'glass-card text-slate-300 hover:border-cyan-500/40'
                    }`}
                  >
                    🐛 Report a Bug
                  </button>
                  {currentUser.role === 'admin' && (
                    <button
                      type="button"
                      onClick={() => setActiveSection('admin')}
                      class={`px-5 py-2.5 rounded-xl font-mono-code text-xs font-bold transition-all ${
                        activeSection === 'admin'
                          ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20'
                          : 'glass-card text-amber-400 border-amber-500/30'
                      }`}
                    >
                      🛡️ Admin Overview
                    </button>
                  )}
                </div>

                {/* РАЗДЕЛ 1: СБОРКИ ДЛЯ СКАЧИВАНИЯ */}
                {activeSection === 'builds' && (
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass-card rounded-3xl p-6 flex flex-col justify-between space-y-6 hover:border-cyan-500/40 transition-all">
                      <div>
                        <div class="flex items-center justify-between mb-4">
                          <span class="px-3 py-1 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 font-mono-code text-xs font-bold">
                            READY TO TEST
                          </span>
                          <span class="font-mono-code text-xs text-slate-400">Build #104</span>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2">Vodičák SK (v1.3-beta)</h3>
                        <p class="text-sm text-slate-400 leading-relaxed">
                          Updated driving exam simulator with new 2026 Slovak traffic signs, offline mode, and multi-language translation.
                        </p>
                      </div>
                      <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">
                        <span class="text-xs font-mono-code text-slate-400">Android • Google Play</span>
                        <a
                          href="https://play.google.com/apps/testing"
                          target="_blank"
                          rel="noopener noreferrer"
                          class="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-mono-code text-xs font-bold transition-all shadow-md"
                        >
                          Download Build →
                        </a>
                      </div>
                    </div>

                    <div class="glass-card rounded-3xl p-6 flex flex-col justify-between space-y-6 hover:border-cyan-500/40 transition-all">
                      <div>
                        <div class="flex items-center justify-between mb-4">
                          <span class="px-3 py-1 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-400 font-mono-code text-xs font-bold">
                            CLOSED ALPHA
                          </span>
                          <span class="font-mono-code text-xs text-slate-400">Build #012</span>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2">SlovoGo — Slovak A1–C1</h3>
                        <p class="text-sm text-slate-400 leading-relaxed">
                          Offline-first Slovak language learning app with grammar modules, spaced-repetition flashcards, and audio pronunciation.
                        </p>
                      </div>
                      <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">
                        <span class="text-xs font-mono-code text-slate-400">iOS TestFlight / APK</span>
                        <button
                          type="button"
                          onClick={() => setActiveSection('bug')}
                          class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-300 font-mono-code text-xs font-bold transition-all"
                        >
                          Request Invite
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* РАЗДЕЛ 2: ОТПРАВКА БАГ-РЕПОРТА */}
                {activeSection === 'bug' && (
                  <div class="glass-card rounded-3xl p-6 md:p-8 max-w-2xl">
                    <h3 class="text-xl font-bold text-white mb-1">🐛 Submit Bug Report / Feedback</h3>
                    <p class="text-xs font-mono-code text-slate-400 mb-6">
                      Reports are sent directly to NomaByte Studio developers with your tester ID.
                    </p>

                    <form
                      action="https://formspree.io/f/mwlvypbn"
                      method="POST"
                      encType="multipart/form-data"
                      onSubmit={() => { setBugSubmitted(true); setTimeout(() => setBugSubmitted(false), 5000); }}
                      class="space-y-5"
                    >
                      <input type="hidden" name="subject" value={`🐛 BUG REPORT from ${currentUser.name} (${currentUser.email})`} />
                      <input type="hidden" name="tester_email" value={currentUser.email} />

                      <div>
                        <label class="block font-mono-code text-xs text-slate-400 mb-1.5">APPLICATION</label>
                        <select name="app_name" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-400">
                          <option>Vodičák SK (v1.3-beta)</option>
                          <option>SlovoGo (Alpha)</option>
                          <option>Tester Hub Website</option>
                        </select>
                      </div>

                      <div>
                        <label class="block font-mono-code text-xs text-slate-400 mb-1.5">ISSUE DESCRIPTION & STEPS</label>
                        <textarea
                          name="bug_description"
                          rows="4"
                          required
                          placeholder="Describe what happened, screen name, or UI glitch..."
                          class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-400 resize-none"
                        ></textarea>
                      </div>

                      <div>
                        <label class="block font-mono-code text-xs text-slate-400 mb-1.5">SCREENSHOT / LOG FILE (OPTIONAL)</label>
                        <input
                          type="file"
                          name="screenshot_attachment"
                          accept="image/*"
                          class="w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-mono-code file:bg-slate-800 file:text-cyan-400 hover:file:bg-slate-700 cursor-pointer"
                        />
                      </div>

                      <button
                        type="submit"
                        class="w-full py-3.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm font-mono-code transition-all shadow-lg shadow-cyan-500/20"
                      >
                        TRANSMIT REPORT →
                      </button>

                      {bugSubmitted && (
                        <div class="p-4 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-300 text-xs font-mono-code text-center">
                          ✓ Bug report successfully transmitted to NomaByte Studio!
                        </div>
                      )}
                    </form>
                  </div>
                )}

                {/* РАЗДЕЛ 3: ПАНЕЛЬ АДМИНИСТРАТОРА */}
                {activeSection === 'admin' && currentUser.role === 'admin' && (
                  <div class="glass-card rounded-3xl p-6 md:p-8 space-y-4">
                    <h3 class="text-xl font-bold text-amber-400">🛡️ Registered Testers (Local Browser Storage)</h3>
                    <p class="text-xs text-slate-400 font-mono-code">
                      Admin requests are sent directly to your email via Formspree. Below are testers registered on this device:
                    </p>
                    <div class="space-y-2">
                      {getAllUsers().map((u, idx) => (
                        <div key={idx} class="p-3.5 rounded-xl bg-slate-950/80 border border-slate-800 flex items-center justify-between text-xs font-mono-code">
                          <div>
                            <span class="text-white font-bold">{u.name}</span> — <span class="text-slate-400">{u.email}</span>
                          </div>
                          <span class={u.role === 'admin' ? 'text-amber-400 font-bold' : 'text-cyan-400'}>{u.role.toUpperCase()}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            )}

          </main>

          {/* Футер */}
          <footer class="border-t border-slate-800/80 py-6 bg-[#030406]">
            <div class="max-w-5xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4 font-mono-code text-xs text-slate-500">
              <div>© 2026 NomaByte Studio • Tester Hub</div>
              <div class="flex items-center gap-5">
                <a href="index.html" class="hover:text-cyan-400 transition-colors">Home</a>
                <a href="Privacypolicy.html" class="hover:text-cyan-400 transition-colors">Privacy & Rules</a>
                <a href="contact.html" class="hover:text-cyan-400 transition-colors">Contact</a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('dashboard-root')).render(<DashboardApp />);
  </script>
</body>
</html>
